name: Deploy

on:
  push:
    branches: [main]

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build assets
        run: |
          rm -rf node_modules package-lock.json
          npm install
          npm run build

      - name: Deploy to server
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_KEY }}
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER }}
          TARGET: ${{ secrets.DEPLOY_PATH }}
          ARGS: "--no-group --no-owner"
          EXCLUDE: ".git, .github, node_modules, .env, storage/app/*, storage/logs/*, storage/framework/*, bootstrap/cache/*, tests"

      - name: Run post-deploy commands
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}

            # Writable dirs use the two-user pattern: the deploy user OWNS them
            # (so composer/artisan can write cache & logs during deploy), while
            # www-data is the GROUP with group-write + the setgid bit (so the web
            # server can also write at runtime and new files inherit the group).
            # Re-running the chown each deploy self-heals any files the web server
            # created at runtime. Must run BEFORE the artisan commands below.
            sudo chown -R ${{ secrets.DEPLOY_USER }}:www-data storage bootstrap/cache
            sudo find storage bootstrap/cache -type d -exec chmod 2775 {} \;
            sudo find storage bootstrap/cache -type f -exec chmod 0664 {} \;

            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan optimize
