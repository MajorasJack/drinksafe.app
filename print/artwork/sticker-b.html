<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Drink Safe sticker B</title>
<link rel="stylesheet" href="artwork.css">
<style>
    /*
     * 100 x 100mm trim, 3mm bleed all round, leaving a 94mm content square.
     * The QR is the whole point of this one, so it takes a third of the height
     * and everything else is sized around it.
     */
    @page { size: 106.2mm 106.2mm; margin: 0; }
    .piece { width: 106.2mm; height: 106.2mm; }
    .safe { gap: 2.8mm; align-items: flex-start; }
    .qr-block { align-self: center; }
    .mark { width: 11mm; height: 11mm; }
    .wordmark { font-size: 11pt; }
    h1 { font-size: 17pt; line-height: 1.1; }
    .lede { font-size: 8.5pt; }
</style>
</head>
<body>
<div class="piece piece--sticker">
    <div class="safe">
        <div class="masthead">
            <svg class="mark" width="14mm" height="14mm" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="dsTealB" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#2dd4bf"/>
                        <stop offset="1" stop-color="#0d9488"/>
                    </linearGradient>
                </defs>
                <rect width="64" height="64" rx="16" fill="url(#dsTealB)"/>
                <g transform="translate(8 8) scale(2)" fill="none" stroke="#0b1220" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    <path d="M9 12l2 2 4-4"/>
                </g>
            </svg>
            <span class="wordmark">Drink&nbsp;<em>Safe</em></span>
        </div>

        <h1>Something happened<br>on a night out?</h1>

        <img class="qr qr--30 qr-block" src="../qr/qr-home-34mm.svg" alt="">

        <p style="font-size: 11pt; font-weight: 500; line-height: 1.3;">
            Report it anonymously.<br>No names. No sign-up.
        </p>

        <p class="lede">Or check what has been reported at a venue before you go.</p>

        <div class="spacer"></div>

        <p class="url" style="font-size: 10pt;">drinksafe.app</p>
    </div>
</div>
</body>
</html>
